<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phoenix RISC OS — architecture map</title>
<style>
:root{
  color-scheme: light;
  --ink:#1a1a1a; --soft:#4a4a4a; --faint:#767676; --rule:#e0ddd6;
  --bg:#fbfaf7; --card:#fff; --accent:#8a3324; --accent-bg:#fdf3f0;
  --warn-bg:#fff9e8; --warn-edge:#d9a520;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif}
a{color:var(--accent)}
header.mast{padding:22px 26px 16px;border-bottom:3px solid var(--ink);background:var(--card)}
.kicker{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
h1{font-size:1.5rem;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--soft);font-size:.94rem;margin:0;max-width:75ch}
.stamp{margin:14px 0 0;padding:10px 13px;border-radius:5px;font:12.5px/1.5 var(--mono);
  background:var(--accent-bg);border-left:3px solid var(--accent);color:var(--soft)}
.stamp.stale{background:var(--warn-bg);border-left-color:var(--warn-edge)}
.stamp b{color:var(--ink)}
.wrap{display:flex;gap:0;align-items:flex-start;min-height:70vh}
aside{width:290px;flex:0 0 290px;border-right:1px solid var(--rule);padding:18px 16px;
  position:sticky;top:0;max-height:100vh;overflow-y:auto}
main{flex:1;padding:20px 26px;min-width:0}
#q{width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:5px;font-size:14px;background:var(--card)}
.lbl{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  display:block;margin:18px 0 8px}
.layer{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:7px 9px;border-radius:4px;font-size:13.5px;color:var(--ink);line-height:1.35}
.layer:hover{background:var(--card)}
.layer.on{background:var(--accent);color:#fff}
.layer .n{float:right;font:11px/1.5 var(--mono);opacity:.65}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:13px 15px;margin-bottom:9px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card h3{margin:0 0 4px;font-size:14.5px;font-family:var(--mono);font-weight:600;word-break:break-all}
.card .p{font:11.5px/1.4 var(--mono);color:var(--faint);margin:0 0 6px;word-break:break-all}
.card .s{margin:0;font-size:13.5px;color:var(--soft)}
.pill{display:inline-block;font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  padding:3px 6px;border-radius:3px;background:var(--rule);color:var(--soft);margin:0 4px 4px 0}
.pill.t-file{background:#e8eef5;color:#2c4a6b}
.pill.t-function{background:#eef0e8;color:#4a5b2c}
.pill.t-document{background:#f5eee8;color:#6b4a2c}
.pill.t-concept{background:#f0e8f5;color:#563b6b}
#detail{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:20px 22px}
#detail h2{margin:0 0 4px;font-size:1.15rem;font-family:var(--mono);word-break:break-all}
#detail .path{font:12px/1.5 var(--mono);color:var(--faint);margin:0 0 12px;word-break:break-all}
#detail .sum{font-size:14.5px;margin:0 0 16px}
.rel{border-top:1px solid var(--rule);padding-top:13px;margin-top:6px}
.rel h4{margin:0 0 8px;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.rel ul{margin:0 0 12px;padding-left:0;list-style:none}
.rel li{padding:3px 0;font-size:13px}
.rel a{cursor:pointer;text-decoration:none;border-bottom:1px solid transparent;word-break:break-all}
.rel a:hover{border-bottom-color:var(--accent)}
.rel .k{font:10.5px/1 var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-right:7px}
.back{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13.5px;margin-bottom:14px}
.count{color:var(--faint);font-size:13px;margin:0 0 14px}
.err{background:var(--warn-bg);border:1px solid var(--warn-edge);border-radius:6px;padding:20px 22px}
footer{border-top:1px solid var(--rule);padding:18px 26px 50px;color:var(--faint);font-size:13px}
@media(max-width:760px){.wrap{display:block}aside{width:auto;flex:none;position:static;max-height:none;
  border-right:0;border-bottom:1px solid var(--rule)}main{padding:18px}}
</style>
</head>
<body>

<header class="mast">
  <div class="kicker">Phoenix RISC OS · Architecture map</div>
  <h1 id="pname">Phoenix</h1>
  <p class="sub" id="pdesc">Loading…</p>
  <div class="stamp" id="stamp">Reading the map…</div>
</header>

<div class="wrap">
  <aside>
    <span class="lbl">Search</span>
    <input id="q" type="search" placeholder="name, path or summary…" autocomplete="off">
    <span class="lbl">Layers</span>
    <div id="layers"></div>
  </aside>
  <main>
    <div id="view"><p class="count">Loading…</p></div>
  </main>
</div>

<footer>
  Generated from the private Phoenix source tree — summaries and structure only, no source code.
  See <a href="../graph/README.md">how this is produced</a>, and
  <a href="../">the rest of the site</a>.
  Something wrong? <a href="https://github.com/pcrepairzone-arch/phoenix-public/issues">Open an issue</a>.
</footer>

<script>
(function(){
  "use strict";
  var G=null, byId={}, out={}, inn={}, layerOf={}, cur=null;
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};

  function fail(msg){
    $("#view").innerHTML='<div class="err"><strong>'+esc(msg)+'</strong>'+
      '<p style="margin:10px 0 0">This page reads <code>../graph/knowledge-graph.json</code> at runtime. '+
      'Opening it straight off disc with <code>file://</code> will not work — browsers block that fetch. '+
      'View it on the published site, or serve the <code>docs/</code> folder over HTTP '+
      '(<code>python3 -m http.server</code>).</p></div>';
    $("#stamp").textContent="Map not loaded.";
  }

  function stamp(meta){
    var el=$("#stamp");
    if(!meta||!meta.lastAnalyzedAt){
      el.className="stamp stale";
      el.innerHTML="<b>No generation date recorded.</b> Treat everything here as unverified.";
      return;
    }
    var d=new Date(meta.lastAnalyzedAt);
    var days=Math.floor((Date.now()-d.getTime())/86400000);
    var when=d.toISOString().slice(0,10);
    var commit=meta.gitCommitHash?String(meta.gitCommitHash).slice(0,10):"unknown";
    var s="Generated <b>"+when+"</b> ("+days+" days ago) from commit <b>"+esc(commit)+"</b>.";
    if(days>30){
      el.className="stamp stale";
      el.innerHTML=s+" <b>This map is out of date.</b> Believe the shape; distrust the detail. "+
        "A generated map is exactly the kind of thing that is true when written and quietly stops being true.";
    }else{
      el.className="stamp";
      el.innerHTML=s+" Check this date before trusting the detail — it is a build stamp and it exists to be read.";
    }
  }

  function index(){
    G.nodes.forEach(function(n){ byId[n.id]=n; });
    (G.edges||[]).forEach(function(e){
      (out[e.source]=out[e.source]||[]).push(e);
      (inn[e.target]=inn[e.target]||[]).push(e);
    });
    (G.layers||[]).forEach(function(L){
      (L.nodeIds||[]).forEach(function(id){ layerOf[id]=L; });
    });
  }

  function pill(n){ return '<span class="pill t-'+esc(n.type)+'">'+esc(n.type)+'</span>'; }

  function card(n){
    return '<div class="card" data-id="'+esc(n.id)+'">'+
      '<h3>'+esc(n.name)+'</h3>'+
      (n.filePath?'<p class="p">'+esc(n.filePath)+
        (n.lineRange?" : "+n.lineRange[0]+"–"+n.lineRange[1]:"")+'</p>':'')+
      '<p class="s">'+esc(n.summary||"No summary.")+'</p>'+
      '<div style="margin-top:8px">'+pill(n)+
        (n.tags||[]).slice(0,6).map(function(t){return '<span class="pill">'+esc(t)+'</span>'}).join("")+
      '</div></div>';
  }

  function list(nodes,heading){
    var v=$("#view");
    if(!nodes.length){ v.innerHTML='<p class="count">Nothing matches.</p>'; return; }
    v.innerHTML='<p class="count">'+esc(heading)+' — '+nodes.length+' item'+(nodes.length===1?"":"s")+'</p>'+
      nodes.slice(0,400).map(card).join("")+
      (nodes.length>400?'<p class="count">Showing the first 400. Narrow the search.</p>':'');
  }

  function rel(edges,dir){
    if(!edges||!edges.length) return "";
    var seen={},items=[];
    edges.forEach(function(e){
      var id=dir==="out"?e.target:e.source, k=e.type+"|"+id;
      if(seen[k])return; seen[k]=1;
      var n=byId[id];
      items.push('<li><span class="k">'+esc(e.type)+'</span>'+
        (n?'<a data-goto="'+esc(id)+'">'+esc(n.name)+'</a>':'<span style="color:var(--faint)">'+esc(id)+'</span>')+
        '</li>');
    });
    return '<h4>'+(dir==="out"?"Depends on / contains":"Referenced by")+'</h4><ul>'+items.join("")+'</ul>';
  }

  function detail(id){
    var n=byId[id]; if(!n) return;
    cur=id;
    var L=layerOf[id];
    $("#view").innerHTML='<button class="back">&larr; back</button>'+
      '<div id="detail"><h2>'+esc(n.name)+'</h2>'+
      (n.filePath?'<p class="path">'+esc(n.filePath)+
        (n.lineRange?" : lines "+n.lineRange[0]+"–"+n.lineRange[1]:"")+
        (n.sizeLines?" · "+n.sizeLines+" lines":"")+'</p>':'')+
      '<div style="margin-bottom:12px">'+pill(n)+
        (n.complexity?'<span class="pill">'+esc(n.complexity)+'</span>':'')+
        (L?'<span class="pill">'+esc(L.name)+'</span>':'')+
        (n.tags||[]).map(function(t){return '<span class="pill">'+esc(t)+'</span>'}).join("")+
      '</div>'+
      '<p class="sum">'+esc(n.summary||"No summary recorded.")+'</p>'+
      (n.languageNotes?'<p class="sum" style="color:var(--soft)">'+esc(n.languageNotes)+'</p>':'')+
      '<div class="rel">'+rel(out[id],"out")+rel(inn[id],"in")+'</div>'+
      '</div>';
    window.scrollTo(0,0);
  }

  function showLayer(L){
    Array.prototype.forEach.call(document.querySelectorAll(".layer"),function(b){
      b.classList.toggle("on", b.dataset.id===L.id); });
    var nodes=(L.nodeIds||[]).map(function(i){return byId[i]}).filter(Boolean);
    $("#view").innerHTML='<p class="count"><strong>'+esc(L.name)+'</strong> — '+nodes.length+' items</p>'+
      (L.description?'<p style="max-width:75ch;color:var(--soft);margin:-6px 0 16px">'+esc(L.description)+'</p>':'')+
      nodes.map(card).join("");
    window.scrollTo(0,0);
  }

  function search(t){
    t=t.trim().toLowerCase();
    Array.prototype.forEach.call(document.querySelectorAll(".layer"),function(b){b.classList.remove("on")});
    if(!t){ overview(); return; }
    var hits=G.nodes.filter(function(n){
      return (n.name||"").toLowerCase().indexOf(t)>=0
          || (n.filePath||"").toLowerCase().indexOf(t)>=0
          || (n.summary||"").toLowerCase().indexOf(t)>=0
          || (n.tags||[]).join(" ").toLowerCase().indexOf(t)>=0;
    });
    list(hits,'Matching "'+t+'"');
  }

  function overview(){
    var counts={};
    G.nodes.forEach(function(n){counts[n.type]=(counts[n.type]||0)+1});
    var rows=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]})
      .map(function(k){return '<span class="pill t-'+esc(k)+'">'+esc(k)+" "+counts[k]+'</span>'}).join(" ");
    var tour=(G.tour||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0)});
    $("#view").innerHTML=
      '<p class="count">'+G.nodes.length+' nodes · '+(G.edges||[]).length+' relationships · '+
        (G.layers||[]).length+' layers</p>'+
      '<div style="margin-bottom:22px">'+rows+'</div>'+
      (tour.length?'<h2 style="font-size:1.1rem;margin:0 0 4px">Guided tour</h2>'+
        '<p style="color:var(--soft);margin:0 0 14px;max-width:75ch">A reading order through the codebase, '+
        'generated with it. Start here if you have never seen Phoenix before.</p>'+
        tour.map(function(t){return '<div class="card" style="cursor:default">'+
          '<h3 style="font-family:inherit">'+(t.order||"")+'. '+esc(t.title)+'</h3>'+
          '<p class="s">'+esc(t.description)+'</p></div>'}).join(""):'')+
      '<p class="count" style="margin-top:20px">Pick a layer on the left, or search.</p>';
  }

  document.addEventListener("click",function(ev){
    var c=ev.target.closest?ev.target.closest(".card[data-id]"):null;
    if(c){ detail(c.dataset.id); return; }
    if(ev.target.dataset && ev.target.dataset.goto){ detail(ev.target.dataset.goto); return; }
    if(ev.target.classList && ev.target.classList.contains("back")){
      var L=layerOf[cur]; if(L) showLayer(L); else overview(); return;
    }
    var b=ev.target.closest?ev.target.closest(".layer"):null;
    if(b){ $("#q").value=""; showLayer(G.layers.filter(function(L){return L.id===b.dataset.id})[0]); }
  });

  var timer=null;
  document.addEventListener("input",function(ev){
    if(ev.target.id!=="q")return;
    clearTimeout(timer); var v=ev.target.value;
    timer=setTimeout(function(){search(v)},140);
  });

  Promise.all([
    fetch("../graph/knowledge-graph.json").then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }),
    fetch("../graph/meta.json").then(function(r){return r.ok?r.json():null}).catch(function(){return null})
  ]).then(function(res){
    G=res[0]; index(); stamp(res[1]);
    if(G.project){
      $("#pname").textContent=G.project.name||"Phoenix";
      $("#pdesc").textContent=G.project.description||"";
    }
    $("#layers").innerHTML=(G.layers||[]).map(function(L){
      return '<button class="layer" data-id="'+esc(L.id)+'">'+esc(L.name)+
             '<span class="n">'+((L.nodeIds||[]).length)+'</span></button>';
    }).join("");
    overview();
  }).catch(function(e){ fail("Could not load the architecture map ("+e.message+")."); });
})();
</script>
</body>
</html>
